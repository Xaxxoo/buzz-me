  body { background: var(--color-bg); color: var(--color-ink); font-family: var(--font-body); -webkit-font-smoothing: antialiased; overflow-x: hidden; }

  .page-title { font: 800 28px/1.1 var(--font-display); color: var(--color-sun); margin-bottom: 6px; }
  .page-sub { font: 400 14px/1.5 var(--font-body); color: var(--color-muted); margin-bottom: 32px; }

  .tabs { display: flex; gap: 4px; margin-bottom: 24px; }
  .tab { padding: 10px 22px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.06); background: transparent; color: var(--color-muted); font: 600 13px var(--font-body); cursor: pointer; transition: all 150ms ease; }

  .tab.active { background: rgba(198,244,50,0.08); color: var(--color-sun); border-color: rgba(198,244,50,0.2); }

  .campus-card { background: var(--color-surface); border: 1px solid rgba(255,255,255,0.06); border-radius: 16px; overflow: hidden; }
  .canvas-wrap { position: relative; width: 100%; aspect-ratio: 16/10; background: #0d1117; }
  .canvas-wrap canvas { width: 100%; height: 100%; display: block; }

  .campus-info { padding: 20px 24px; display: flex; gap: 32px; flex-wrap: wrap; border-top: 1px solid rgba(255,255,255,0.06); }
  .campus-info-block { }
  .campus-info-label { font: 500 10.5px var(--font-body); color: var(--color-muted); text-transform: uppercase; letter-spacing: .08em; margin-bottom: 4px; }
  .campus-info-value { font: 600 14px var(--font-body); color: var(--color-ink); }

  .legend { display: flex; gap: 16px; flex-wrap: wrap; margin-top: 20px; padding: 16px 24px; border-top: 1px solid rgba(255,255,255,0.04); }
  .legend-item { display: flex; align-items: center; gap: 6px; font: 400 12px var(--font-body); color: var(--color-muted); }
  .legend-swatch { width: 12px; height: 12px; border-radius: 3px; flex-shrink: 0; }
</style>

const canvas = document.getElementById('iso');
const ctx = canvas.getContext('2d');
let current = 0;
let animProgress = 0;
let animFrame;

function resize() {
  const wrap = canvas.parentElement;
  const r = window.devicePixelRatio || 1;
  canvas.width = wrap.clientWidth * r;
  canvas.height = wrap.clientHeight * r;
  ctx.setTransform(r, 0, 0, r, 0, 0);
  canvas.style.width = wrap.clientWidth + 'px';
  canvas.style.height = wrap.clientHeight + 'px';
}

// Isometric projection
const ANGLE = Math.PI / 6; // 30 degrees
const COS = Math.cos(ANGLE);
const SIN = Math.sin(ANGLE);

function isoProject(x, y, z, cx, cy, scale) {
  const sx = (x - y) * COS * scale;
  const sy = (x + y) * SIN * scale - z * scale;
  return [cx + sx, cy + sy];
}

function darken(hex, amount) {
  const r = Math.max(0, parseInt(hex.slice(1,3), 16) - amount);
  const g = Math.max(0, parseInt(hex.slice(3,5), 16) - amount);
  const b = Math.max(0, parseInt(hex.slice(5,7), 16) - amount);
  return `rgb(${r},${g},${b})`;
}

function lighten(hex, amount) {
  const r = Math.min(255, parseInt(hex.slice(1,3), 16) + amount);
  const g = Math.min(255, parseInt(hex.slice(3,5), 16) + amount);
  const b = Math.min(255, parseInt(hex.slice(5,7), 16) + amount);
  return `rgb(${r},${g},${b})`;
}

function hexToRgba(hex, a) {
  const r = parseInt(hex.slice(1,3), 16);
  const g = parseInt(hex.slice(3,5), 16);
  const b = parseInt(hex.slice(5,7), 16);
  return `rgba(${r},${g},${b},${a})`;
}

function drawGround(campus, W, H, scale, cx, cy) {
  // Ground plane
  const corners = [
    isoProject(-5, -5, 0, cx, cy, scale),
    isoProject(105, -5, 0, cx, cy, scale),
    isoProject(105, 105, 0, cx, cy, scale),
    isoProject(-5, 105, 0, cx, cy, scale),
  ];
  const grad = ctx.createLinearGradient(0, 0, 0, H);
  grad.addColorStop(0, '#0f1a0f');
  grad.addColorStop(0.5, campus.groundColor);
  grad.addColorStop(1, '#0d150d');
  ctx.fillStyle = grad;
  ctx.beginPath();
  ctx.moveTo(corners[0][0], corners[0][1]);
  corners.forEach(c => ctx.lineTo(c[0], c[1]));
  ctx.closePath();
  ctx.fill();

  // Grid lines
  ctx.strokeStyle = 'rgba(255,255,255,0.03)';
  ctx.lineWidth = 0.5;
  for (let i = 0; i <= 100; i += 10) {
    const a = isoProject(i, -5, 0, cx, cy, scale);
    const b = isoProject(i, 105, 0, cx, cy, scale);
    ctx.beginPath(); ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], b[1]); ctx.stroke();
    const c = isoProject(-5, i, 0, cx, cy, scale);
    const d = isoProject(105, i, 0, cx, cy, scale);
    ctx.beginPath(); ctx.moveTo(c[0], c[1]); ctx.lineTo(d[0], d[1]); ctx.stroke();
  }
}

function drawPath(points, cx, cy, scale) {
  if (points.length < 2) return;
  ctx.strokeStyle = 'rgba(220,210,190,0.12)';
  ctx.lineWidth = scale * 2.5;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  ctx.beginPath();
  const s = isoProject(points[0][0], points[0][1], 0, cx, cy, scale);
  ctx.moveTo(s[0], s[1]);
  for (let i = 1; i < points.length; i++) {
    const p = isoProject(points[i][0], points[i][1], 0, cx, cy, scale);
    ctx.lineTo(p[0], p[1]);
  }
  ctx.stroke();

  // path fill (lighter strip)
  ctx.strokeStyle = 'rgba(220,210,190,0.06)';
  ctx.lineWidth = scale * 4;
  ctx.beginPath();
  ctx.moveTo(s[0], s[1]);
  for (let i = 1; i < points.length; i++) {
    const p = isoProject(points[i][0], points[i][1], 0, cx, cy, scale);
    ctx.lineTo(p[0], p[1]);
  }
  ctx.stroke();
}

function drawTree(x, y, cx, cy, scale, progress) {
  const th = 6 * progress;
  const base = isoProject(x, y, 0, cx, cy, scale);
  const top = isoProject(x, y, th, cx, cy, scale);

  // trunk
  ctx.strokeStyle = '#5C4033';
  ctx.lineWidth = scale * 1.2;
  ctx.beginPath();
  ctx.moveTo(base[0], base[1]);
  ctx.lineTo(top[0], top[1]);
  ctx.stroke();

  // foliage layers
  const layers = [
    { z: th * 0.5, r: scale * 3.5, c: '#1B5E20' },
    { z: th * 0.7, r: scale * 3,   c: '#2E7D32' },
    { z: th * 0.9, r: scale * 2.2, c: '#388E3C' },
  ];
  layers.forEach(l => {
    const p = isoProject(x, y, l.z, cx, cy, scale);
    ctx.fillStyle = l.c;
    ctx.beginPath();
    ctx.ellipse(p[0], p[1], l.r, l.r * 0.7, 0, 0, Math.PI * 2);
    ctx.fill();
  });
}

function drawBuilding(b, cx, cy, scale, progress) {
  const bx = b.x - b.w/2;
  const by = b.y - b.d/2;
  const h = b.h * progress;

  // 8 corners of the box
  const p = (x, y, z) => isoProject(x, y, z, cx, cy, scale);

  const bl_b = p(bx, by + b.d, 0);
  const br_b = p(bx + b.w, by + b.d, 0);
  const fr_b = p(bx + b.w, by, 0);
  const fl_b = p(bx, by, 0);

  const bl_t = p(bx, by + b.d, h);
  const br_t = p(bx + b.w, by + b.d, h);
  const fr_t = p(bx + b.w, by, h);
  const fl_t = p(bx, by, h);

  const col = b.color;
  const colDark = darken(col, 40);
  const colDarker = darken(col, 65);
  const colLight = lighten(col, 20);

  // Shadow on ground
  ctx.fillStyle = 'rgba(0,0,0,0.15)';
  const sh = h * 0.3;
  const s1 = p(bx + sh * 0.5, by - sh * 0.3, 0);
  const s2 = p(bx + b.w + sh * 0.5, by - sh * 0.3, 0);
  const s3 = p(bx + b.w, by + b.d, 0);
  const s4 = p(bx, by + b.d, 0);
  ctx.beginPath();
  ctx.moveTo(s4[0], s4[1]); ctx.lineTo(s1[0], s1[1]); ctx.lineTo(s2[0], s2[1]); ctx.lineTo(s3[0], s3[1]);
  ctx.closePath(); ctx.fill();

  // Left face (darker)
  ctx.fillStyle = colDarker;
  ctx.beginPath();
  ctx.moveTo(bl_b[0], bl_b[1]); ctx.lineTo(fl_b[0], fl_b[1]);
  ctx.lineTo(fl_t[0], fl_t[1]); ctx.lineTo(bl_t[0], bl_t[1]);
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle = 'rgba(0,0,0,0.2)'; ctx.lineWidth = 0.5; ctx.stroke();

  // Right face (medium)
  ctx.fillStyle = colDark;
  ctx.beginPath();
  ctx.moveTo(fl_b[0], fl_b[1]); ctx.lineTo(fr_b[0], fr_b[1]);
  ctx.lineTo(fr_t[0], fr_t[1]); ctx.lineTo(fl_t[0], fl_t[1]);
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle = 'rgba(0,0,0,0.2)'; ctx.lineWidth = 0.5; ctx.stroke();

  // Top face (lightest)
  ctx.fillStyle = colLight;
  ctx.beginPath();
  ctx.moveTo(bl_t[0], bl_t[1]); ctx.lineTo(br_t[0], br_t[1]);
  ctx.lineTo(fr_t[0], fr_t[1]); ctx.lineTo(fl_t[0], fl_t[1]);
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle = 'rgba(0,0,0,0.15)'; ctx.lineWidth = 0.5; ctx.stroke();

  // Windows (on right face)
  if (h > 5 && b.type !== 'sports' && b.type !== 'gate') {
    const rows = Math.max(1, Math.floor(h / 5));
    const cols = Math.max(1, Math.floor(b.w / 5));
    ctx.fillStyle = 'rgba(255,240,180,0.25)';
    for (let r = 0; r < rows; r++) {
      for (let c = 0; c < cols; c++) {
        const wx = bx + 2 + c * (b.w - 4) / cols + (b.w - 4) / cols * 0.15;
        const wy = by - 0.1;
        const wz = 2 + r * (h - 3) / rows;
        const ww = (b.w - 4) / cols * 0.5;
        const wh = (h - 3) / rows * 0.5;
        const w1 = p(wx, wy, wz);
        const w2 = p(wx + ww, wy, wz);
        const w3 = p(wx + ww, wy, wz + wh);
        const w4 = p(wx, wy, wz + wh);
        ctx.beginPath();
        ctx.moveTo(w1[0], w1[1]); ctx.lineTo(w2[0], w2[1]);
        ctx.lineTo(w3[0], w3[1]); ctx.lineTo(w4[0], w4[1]);
        ctx.closePath(); ctx.fill();
      }
    }
    // left face windows
    ctx.fillStyle = 'rgba(255,240,180,0.15)';
    const lcols = Math.max(1, Math.floor(b.d / 5));
    for (let r = 0; r < rows; r++) {
      for (let c = 0; c < lcols; c++) {
        const wy = by + 2 + c * (b.d - 4) / lcols + (b.d - 4) / lcols * 0.15;
        const wx = bx - 0.1;
        const wz = 2 + r * (h - 3) / rows;
        const ww = (b.d - 4) / lcols * 0.5;
        const wh = (h - 3) / rows * 0.5;
        const w1 = p(wx, wy, wz);
        const w2 = p(wx, wy + ww, wz);
        const w3 = p(wx, wy + ww, wz + wh);
        const w4 = p(wx, wy, wz + wh);
        ctx.beginPath();
        ctx.moveTo(w1[0], w1[1]); ctx.lineTo(w2[0], w2[1]);
        ctx.lineTo(w3[0], w3[1]); ctx.lineTo(w4[0], w4[1]);
        ctx.closePath(); ctx.fill();
      }
    }
  }

  // Sports field lines
  if (b.type === 'sports') {
    ctx.strokeStyle = 'rgba(255,255,255,0.2)';
    ctx.lineWidth = scale * 0.8;
    // Outer border
    const m = 1.5;
    const a1 = p(bx + m, by + m, h + 0.1);
    const a2 = p(bx + b.w - m, by + m, h + 0.1);
    const a3 = p(bx + b.w - m, by + b.d - m, h + 0.1);
    const a4 = p(bx + m, by + b.d - m, h + 0.1);
    ctx.beginPath();
    ctx.moveTo(a1[0], a1[1]); ctx.lineTo(a2[0], a2[1]);
    ctx.lineTo(a3[0], a3[1]); ctx.lineTo(a4[0], a4[1]);
    ctx.closePath(); ctx.stroke();
    // Center line
    const c1 = p(bx + b.w / 2, by + m, h + 0.1);
    const c2 = p(bx + b.w / 2, by + b.d - m, h + 0.1);
    ctx.beginPath(); ctx.moveTo(c1[0], c1[1]); ctx.lineTo(c2[0], c2[1]); ctx.stroke();
    // Center circle
    const cc = p(bx + b.w / 2, by + b.d / 2, h + 0.1);
    ctx.beginPath(); ctx.ellipse(cc[0], cc[1], scale * 3, scale * 2, -ANGLE, 0, Math.PI * 2); ctx.stroke();
  }

  // Gate arch
  if (b.type === 'gate') {
    ctx.strokeStyle = hexToRgba(colLight, 0.7);
    ctx.lineWidth = scale * 1.5;
    const archMid = p(bx + b.w / 2, by, h + 3 * progress);
    const archL = p(bx + b.w * 0.3, by, h);
    const archR = p(bx + b.w * 0.7, by, h);
    ctx.beginPath();
    ctx.moveTo(archL[0], archL[1]);
    ctx.quadraticCurveTo(archMid[0], archMid[1] - scale * 3, archR[0], archR[1]);
    ctx.stroke();
  }

  // Label
  if (progress > 0.8) {
    const labelAlpha = Math.min(1, (progress - 0.8) / 0.2);
    const lp = p(bx + b.w / 2, by + b.d / 2, h + 4);
    ctx.save();
    ctx.globalAlpha = labelAlpha;

    // Label background
    ctx.font = `600 ${Math.max(9, scale * 2.8)}px 'Inter Tight', sans-serif`;
    const tm = ctx.measureText(b.name);
    const lw = tm.width + 12;
    const lh = 18;

    ctx.fillStyle = 'rgba(10,10,9,0.85)';
    const rr = 5;
    const lx = lp[0] - lw / 2;
    const ly = lp[1] - lh / 2 - 2;
    ctx.beginPath();
    ctx.roundRect(lx, ly, lw, lh, rr);
    ctx.fill();
    ctx.strokeStyle = hexToRgba(col, 0.4);
    ctx.lineWidth = 1;
    ctx.stroke();

    // dot
    ctx.fillStyle = col;
    ctx.beginPath();
    ctx.arc(lx + 8, ly + lh / 2, 2.5, 0, Math.PI * 2);
    ctx.fill();

    // text
    ctx.fillStyle = '#f0ebe3';
    ctx.textAlign = 'left';
    ctx.textBaseline = 'middle';
    ctx.fillText(b.name, lx + 15, ly + lh / 2 + 0.5);

    ctx.restore();
  }
}

function draw(campus, progress) {
  const W = canvas.parentElement.clientWidth;
  const H = canvas.parentElement.clientHeight;
  const scale = Math.min(W, H) / 135;
  const cx = W * 0.5;
  const cy = H * 0.38;

  // Background sky
  const skyGrad = ctx.createLinearGradient(0, 0, 0, H);
  skyGrad.addColorStop(0, '#0b1220');
  skyGrad.addColorStop(0.4, '#0d1117');
  skyGrad.addColorStop(1, '#0a0e14');
  ctx.fillStyle = skyGrad;
  ctx.fillRect(0, 0, W, H);

  // Stars
  ctx.fillStyle = 'rgba(255,255,255,0.3)';
  for (let i = 0; i < 40; i++) {
    const sx = (Math.sin(i * 127.1 + 311.7) * 0.5 + 0.5) * W;
    const sy = (Math.sin(i * 269.5 + 183.3) * 0.5 + 0.5) * H * 0.5;
    const sr = 0.5 + Math.sin(i * 43.3) * 0.4;
    ctx.beginPath(); ctx.arc(sx, sy, sr, 0, Math.PI * 2); ctx.fill();
  }

  // Ambient glow behind campus
  const glow = ctx.createRadialGradient(cx, cy + H * 0.15, 0, cx, cy + H * 0.15, H * 0.6);
  glow.addColorStop(0, hexToRgba(campus.accent, 0.06));
  glow.addColorStop(0.5, hexToRgba(campus.accent, 0.02));
  glow.addColorStop(1, 'transparent');
  ctx.fillStyle = glow;
  ctx.fillRect(0, 0, W, H);

  drawGround(campus, W, H, scale, cx, cy);

  // Paths
  campus.paths.forEach(pts => drawPath(pts, cx, cy, scale));

  // Sort buildings + trees by y for correct overlap (painter's algorithm)
  const allItems = [];
  campus.buildings.forEach(b => allItems.push({ type: 'building', data: b, sortY: b.y + b.d / 2 - b.x }));
  campus.trees.forEach(t => allItems.push({ type: 'tree', data: t, sortY: t[1] - t[0] }));
  allItems.sort((a, b) => a.sortY - b.sortY);

  allItems.forEach(item => {
    if (item.type === 'building') {
      drawBuilding(item.data, cx, cy, scale, progress);
    } else {
      drawTree(item.data[0], item.data[1], cx, cy, scale, progress);
    }
  });

  // Title overlay
  if (progress > 0.5) {
    const ta = Math.min(1, (progress - 0.5) / 0.3);
    ctx.save();
    ctx.globalAlpha = ta;
    ctx.font = `800 ${scale * 4}px 'Unbounded', sans-serif`;
    ctx.fillStyle = campus.accent;
    ctx.textAlign = 'left';
    ctx.textBaseline = 'top';
    ctx.fillText(campus.name, 24, H - scale * 8);
    ctx.font = `500 ${scale * 2}px 'Inter Tight', sans-serif`;
    ctx.fillStyle = 'rgba(240,235,227,0.5)';
    ctx.fillText(campus.university, 24, H - scale * 4);
    ctx.restore();
  }
}

function switchCampus(idx) {
  current = idx;
  document.querySelectorAll('.tab').forEach((t, i) => t.classList.toggle('active', i === idx));
  animProgress = 0;
  cancelAnimationFrame(animFrame);
  animate();
  updateInfo(CAMPUSES[idx]);
}

function animate() {
  animProgress += 0.02;
  if (animProgress > 1) animProgress = 1;
  const eased = 1 - Math.pow(1 - animProgress, 3); // ease-out cubic
  resize();
  draw(CAMPUSES[current], eased);
  if (animProgress < 1) {
    animFrame = requestAnimationFrame(animate);
  }
}

function updateInfo(c) {
  const info = document.getElementById('info');
  const typeCounts = {};
  c.buildings.forEach(b => { typeCounts[b.type] = (typeCounts[b.type] || 0) + 1; });
  info.innerHTML = `
    <div class="campus-info-block"><div class="campus-info-label">Campus</div><div class="campus-info-value">${c.name}</div></div>
    <div class="campus-info-block"><div class="campus-info-label">University</div><div class="campus-info-value">${c.university}</div></div>
    <div class="campus-info-block"><div class="campus-info-label">Buildings</div><div class="campus-info-value">${c.buildings.length}</div></div>
    <div class="campus-info-block"><div class="campus-info-label">Landmarks</div><div class="campus-info-value">${c.landmarks}</div></div>
  `;

  const legend = document.getElementById('legend');
  const types = { gate: '#8E1B3A', library: '#F5C518', faculty: '#0B8457', hostel: '#D4A373', sports: '#2D6A4F', cafeteria: '#E76F51', admin_block: '#6B4C3B', lab: '#4A6FA5' };
  legend.innerHTML = Object.entries(types)
    .filter(([t]) => c.buildings.some(b => b.type === t))
    .map(([t, col]) => `<div class="legend-item"><div class="legend-swatch" style="background:${col}"></div>${t.replace('_', ' ')}</div>`)
    .join('');
}

// roundRect polyfill for older browsers
if (!ctx.roundRect) {
  ctx.roundRect = function(x, y, w, h, r) {
    this.moveTo(x + r, y);
    this.lineTo(x + w - r, y);
    this.arcTo(x + w, y, x + w, y + r, r);
    this.lineTo(x + w, y + h - r);
    this.arcTo(x + w, y + h, x + w - r, y + h, r);
    this.lineTo(x + r, y + h);
    this.arcTo(x, y + h, x, y + h - r, r);
    this.lineTo(x, y + r);
    this.arcTo(x, y, x + r, y, r);
  };
}

window.addEventListener('resize', () => { resize(); draw(CAMPUSES[current], Math.min(1, animProgress)); });
switchCampus(0);
</script>
</body>
</html>
